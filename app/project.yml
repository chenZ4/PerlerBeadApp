# XcodeGen 工程规范：生成 PerlerApp.xcodeproj（SPM 无法承载 XCUITest，
# UI 测试需要真正的 app target）。生成方式：
#   brew install xcodegen
#   cd app && xcodegen generate
# 生成的 .xcodeproj 已 gitignore，不进版本库；本文件是唯一事实来源。
name: PerlerApp
options:
  bundleIdPrefix: com.perler
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # ad-hoc 签名（"-"）：免证书但保留签名，macOS 才允许 xctrunner 启动
    # （完全禁签会报 "Test crashed with signal kill before establishing connection"）
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Xcode 26 显式模块构建会让多 target 的 .swiftmodule 输出撞路径
    SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
    # 消除传统 headermap 警告
    ALWAYS_SEARCH_USER_PATHS: "NO"
targets:
  PerlerApp:
    type: application
    platform: macOS
    sources:
      - Sources/PerlerApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.perler.app
        SWIFT_VERSION: "5.0"
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: PerlerApp
  PerlerAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/PerlerAppUITests
    dependencies:
      - target: PerlerApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.perler.uitests
        SWIFT_VERSION: "5.0"
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: PerlerAppUITests
schemes:
  PerlerApp:
    build:
      targets:
        PerlerApp: all
        PerlerAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PerlerAppUITests
